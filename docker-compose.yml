  geoserver_auto_publish:
    image: alpine:3.20           # tiny base image
    depends_on:
      - geoserver
      - postgres
    environment:
      # ── credentials ─────────────────────────────
      PGHOST:     postgres
      PGUSER:     admin
      PGPASSWORD: admin
      PGDATABASE: spatialdb

      GEOSERVER_URL:  http://geoserver:8080/geoserver
      GEOSERVER_USER: admin
      GEOSERVER_PASS: admin

      WORKSPACE:  shanghai_properties
      DATASTORE:  cdh_mezz_postgis
    volumes:
      - ./auto-publish:/scripts           # put the script below here
    command: /scripts/auto-publish.sh
    restart: unless-stopped
volumes:
  pg_data:
  pgadmin_data:
