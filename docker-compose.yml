  # ── GeoServer (WMS / WFS) ─────────────────────────────────────────────────────
  geoserver:
    image: kartoza/geoserver:2.27.1
    environment:
      GWC_DISKQUOTA_STORE: "file"
      GEOSERVER_ADMIN_USER: admin
      GEOSERVER_ADMIN_PASSWORD: admin
    # depends_on:
      # postgres:
        # condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/geoserver/web || exit 1" ]
      interval: 15s
      retries: 5

  geoserver_setup:
    image: alpine/curl:latest
    depends_on:
      geoserver:
        condition: service_healthy # Waits for GeoServer to be healthy
    volumes:
      - ./geoserver-setup:/setup
    command: sh /setup/configure-geoserver.sh
    restart: on-failure # If it fails, try again a few times


  mapstore:
    image: geosolutionsit/mapstore2:latest          # ✔ runs MapStore 2
    environment:                                   # YAML block (not a list)
      # ↙ internal container-to-container endpoint
      MAPSTORE_GEOSERVER_URL: "http://geoserver:8080/geoserver/"
      # ↙ endpoint exposed to the browser for the print plugin
      MAPSTORE_PRINT_URL:   "http://geoserver:8080/geoserver/pdf"
      # ↙ alias=URL  (equals sign--not colon)  for JS URL-rewriting
      MAPSTORE_GEOSERVER_OVERRIDES: "geoserver=http://geoserver:8080/geoserver/"
      # Optional—supply GeoServer admin creds if you need secured layers
      MAPSTORE_GEOSERVER_USER: admin
      MAPSTORE_GEOSERVER_PASSWORD: geoserver
    #volumes:
      # Hot-swap a tweaked localConfig.json while you iterate
      #- ./mapstore-config/localConfig.json:/usr/local/tomcat/webapps/mapstore/localConfig.json
    depends_on:
      - geoserver
    ports:
      - "3050:8080"     # host-port 3050 → container 8080
    restart: unless-stopped

